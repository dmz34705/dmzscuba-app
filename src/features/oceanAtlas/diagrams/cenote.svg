 <path d="M79 13L84 10" stroke="#18394A" stroke-width="5"/>
 <path d="M82 8L90 7 108-1 104 10 88 16 82 14Z" fill="#8BD6C2" stroke="#ADDCCB" stroke-width=".7"/>
 <path d="M88 11L101 5M95 27L109 22" stroke="#386C70" stroke-width=".8" opacity=".55"/>
 <g stroke="#A3D6D3" stroke-width="1" opacity=".65"><circle cx="-24" cy="-2" r="2"/><circle cx="-29" cy="-16" r="3"/><circle cx="-23" cy="-34" r="3.7"/><circle cx="-30" cy="-57" r="2"/></g>
