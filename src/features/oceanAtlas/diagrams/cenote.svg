 <path d="M1 16L-4 16" stroke="#ADD0C9" stroke-width="4"/>
 <path d="M-5 12Q-9 7-15 9Q-23 12-22 19Q-20 26-12 26L-5 22Z" fill="#173445" stroke="#8DBDBE" stroke-width="1.1"/>
 <path d="M-21 16L-12 15-11 20-21 21Z" fill="#A9E6DC" stroke="#D1F1E7" stroke-width=".9"/>
 <path d="M-11 16L-5 16" stroke="#B2D4CC" stroke-width="1.1"/>
 <path d="M-21 23L-16 23" stroke="#C6E4DC" stroke-width="2"/>
 <path d="M-17 24Q-5 32 5 17" stroke="#8BB6B7" stroke-width="1.3"/>
 <!-- Torch held ahead of the body. -->
 <path d="M-25 29L-33 29" stroke="#D0DCC4" stroke-width="3.5"/>
 <!-- Near arm bends forward, hands together, clear of the bottom. -->
 <path d="M12 22Q10 29 1 34L-14 32" stroke="#B1D8D1" stroke-width="5.5"/>
 <path d="M-14 32L-20 31" stroke="#C6E5D9" stroke-width="3.5"/>
 <!-- Hip, bent knee, lower leg, boot and near blade fin. -->
