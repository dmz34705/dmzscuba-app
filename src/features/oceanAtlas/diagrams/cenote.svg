</g>
<!-- Generic guideline stays clear of formations; not an actual route or survey. -->
<g id="guideline" stroke-linecap="round">
 <path d="M0 426Q230 424 390 394T748 348 960 319" stroke="#CAB991" stroke-width="1.3" opacity=".8"/>

</g>
<!-- A modest torch beam illuminates open water ahead of the diver. -->
<g id="diver-light">
 <path d="M517 282L766 260 758 335Z" fill="#C9ECD9" opacity=".065"/>
 <path d="M517 282L712 280 710 312Z" fill="#C9ECD9" opacity=".045"/>
</g>
<g id="diver" transform="translate(487 251) scale(-1 1)" stroke-linecap="round" stroke-linejoin="round">
