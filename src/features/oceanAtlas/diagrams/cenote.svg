<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none">
<title>DMZ Scuba — cave / cenote profile</title>
<desc>Generic submerged limestone cave / cenote cutaway with an open daylight entrance at left, overhead cavern at right, stalactites, stalagmites, guideline and diver with twin cylinders and a light. Illustrative only, not a surveyed cave, navigation map, clearance measurement or calibrated depth diagram. Surface y=38; deepest floor y=479. Site-specific labels and certification requirements belong in the app.</desc>
<defs>
 <linearGradient id="dmz-water" x1="480" y1="38" x2="480" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#286975"/><stop offset=".5" stop-color="#153F50"/><stop offset="1" stop-color="#092838"/></linearGradient>
 <linearGradient id="dmz-light" x1="480" y1="38" x2="480" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#C0F2E7" stop-opacity=".09"/><stop offset="1" stop-color="#C0F2E7" stop-opacity="0"/></linearGradient>
 <linearGradient id="dmz-sand" x1="0" y1="475" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#3D525B"/><stop offset="1" stop-color="#263C49"/></linearGradient>
</defs>
<!-- Self-contained SVG: paths, circles, gradients. No filters, raster images, fonts or dependencies. -->
<g id="water">
 <path fill="url(#dmz-water)" d="M0 0H960V560H0Z"/>
 <!-- Entrance opening occupies the left third of the cutaway. -->
 <path d="M0 0H353V38H0Z" fill="#0C2736"/>
 <path d="M0 38C62 31 92 43 148 38S250 33 309 38" stroke="#94CBCB" stroke-width="2"/>
 <path d="M51 38H123L223 477H90Z M168 38H223L344 477H252Z M262 38H301L420 477H355Z" fill="url(#dmz-light)"/>
 <!-- Deep passage falls into quieter, darker water. -->
 <path d="M599 179Q794 157 960 210V560H626Q620 362 599 179Z" fill="#092536" opacity=".45"/>
</g>
<g id="particles" fill="#A1D8D1" opacity=".22"><circle cx="152" cy="168" r="1.3"/><circle cx="616" cy="128" r="1.2"/><circle cx="765" cy="247" r="1.4"/><circle cx="201" cy="368" r="1.2"/><circle cx="849" cy="366" r="1"/><circle cx="503" cy="206" r="1"/></g>
<g id="cave-geology" stroke-linecap="round" stroke-linejoin="round">
