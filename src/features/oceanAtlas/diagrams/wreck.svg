<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none">
<title>DMZ Scuba — wreck profile</title>
<desc>Refined vector illustration of a submerged shipwreck and scuba diver. Generic illustrative profile, not a surveyed wreck or calibrated depth diagram. Surface y=38; seabed y=479. Keep site labels in the application.</desc>
<defs>
 <linearGradient id="dmz-water" x1="480" y1="38" x2="480" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#246477"/><stop offset=".5" stop-color="#123E51"/><stop offset="1" stop-color="#092637"/></linearGradient>
 <linearGradient id="dmz-light" x1="480" y1="38" x2="480" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#C0F2E7" stop-opacity=".09"/><stop offset="1" stop-color="#C0F2E7" stop-opacity="0"/></linearGradient>
 <linearGradient id="dmz-hull" x1="510" y1="362" x2="510" y2="477" gradientUnits="userSpaceOnUse"><stop stop-color="#50747C"/><stop offset=".48" stop-color="#345562"/><stop offset="1" stop-color="#1C3949"/></linearGradient>
 <linearGradient id="dmz-bridge" x1="437" y1="296" x2="437" y2="374" gradientUnits="userSpaceOnUse"><stop stop-color="#66868A"/><stop offset="1" stop-color="#3D626D"/></linearGradient>
 <linearGradient id="dmz-sand" x1="0" y1="475" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#3D525B"/><stop offset="1" stop-color="#263C49"/></linearGradient>
</defs>
