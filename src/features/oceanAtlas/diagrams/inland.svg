<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none">
<title>DMZ Scuba — inland profile</title>
<desc>Refined vector illustration of a generic freshwater inland dive site: submerged rock shelf, boulders, aquatic plants and freshwater fish. Illustrative geometry, not a surveyed site or calibrated depth scale. Surface y=38; deepest bed y=479. Keep site-specific labels in the application.</desc>
<defs>
 <linearGradient id="dmz-water" x1="480" y1="38" x2="480" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#356C73"/><stop offset=".5" stop-color="#1C4854"/><stop offset="1" stop-color="#102F3D"/></linearGradient>
 <linearGradient id="dmz-light" x1="480" y1="38" x2="480" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#C0F2E7" stop-opacity=".09"/><stop offset="1" stop-color="#C0F2E7" stop-opacity="0"/></linearGradient>
 <linearGradient id="dmz-sand" x1="0" y1="475" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#3D525B"/><stop offset="1" stop-color="#263C49"/></linearGradient>
</defs>
